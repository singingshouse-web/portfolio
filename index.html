<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YEN作品集</title>
<meta name="description" content="郭俊彥 YEN KUO｜二十多年設計經驗，做網頁前端視覺、廣告媒體與品牌視覺。從設計稿到交付，習慣多想一步。">
<meta property="og:title" content="YEN作品集">
<meta property="og:description" content="二十多年設計經驗，網頁前端視覺、廣告媒體與品牌視覺。從設計稿到交付，習慣多想一步。">
<meta property="og:image" content="./images/og_image.jpg">
<link rel="icon" href="./images/yennext_mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css?v=20261018l">
</head>
<body>

<canvas id="kgrid" aria-hidden="true"></canvas>

<nav class="nav">
  <div class="nav-in">
    <a class="nav-logo is-text" href="./index.html" aria-label="YENnext 首頁">
      <span class="wm"><span class="wm-a">YEN</span><span class="wm-b">next</span></span>
    </a>
    <div class="nav-links">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </div>
</nav>

<div class="intro" id="intro">
<div class="intro-stage">
<div class="pressure-band">
  <div class="wrap"><div id="pressure" aria-hidden="true"></div></div>
</div>

<div class="stream-band" id="streamBand">
  <div class="wrap"><div class="hero-collage" id="heroCollage"></div></div>
</div>
</div>
</div>

<header class="hero">
  <div class="wrap">
    <p class="label" id="tagline"></p>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="hero-meta" id="heroTags"></div>
  </div>
</header>

<section class="section" id="work">
  <div class="wrap">
    <div class="section-head rv">
      <p class="label">Selected Work</p>
      <h2>作品案例</h2>
    </div>
    <p class="work-note rv" id="workNote"></p>
    <div class="filter rv" id="workFilter"></div>
    <div id="workGrid"></div>
    <div class="otherworks rv">
      <p class="label">Also Involved</p>
      <p id="otherWorks"></p>
    </div>
  </div>
</section>

<section class="section" id="about">
  <div class="wrap">
    <div class="section-head rv">
      <p class="label">About</p>
      <h2 id="aboutTitle"></h2>
    </div>
    <div class="about-grid">
      <div class="rv">
        <div class="about-text" id="aboutText"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="orbit rv">
        <div class="profile" id="profile"></div>
        <div class="orbit-list" id="timeline"></div>
      </div>
    </div>

    <div style="margin-top:74px">
      <p class="label" style="margin-bottom:24px">參與服務品牌</p>
      <div class="clients" id="clients"></div>
      <p class="attribution" id="attribution"></p>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <p class="label">Contact</p>
    <h2 id="contactTitle"></h2>
    <a class="mail" id="mail" href="#"></a>
  </div>
</section>

<footer class="footer">
  <div class="wrap footer-in">
    <p class="footer-name"><span class="wm"><span class="wm-a">YEN</span><span class="wm-b">next</span></span></p>
    <small>© <span id="yr"></span> YENNEXT. All rights reserved.</small>
  </div>
</footer>

<script src="./js/grid.js?v=20261018l"></script>
<script src="./js/data.js?v=20261018l"></script>
<script src="./js/main.js?v=20261018l"></script>
</body>
</html>
